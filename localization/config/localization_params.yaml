# AMCL + map_server for the TurtleBot3 Waffle in the office world (Nav2 Humble).
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    scan_topic: scan
    laser_max_range: 3.5
    laser_min_range: -1.0
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    update_min_d: 0.1
    update_min_a: 0.1
    tf_broadcast: True
    transform_tolerance: 1.0
    set_initial_pose: True            # robot spawns at the world origin
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""                 # filled from the launch argument `map`
